[package]
name = "carmen"
version = "1.1.0"
description = "Carmen — offline-first, cross-platform music player"
authors = ["z44d"]
edition = "2021"
rust-version = "1.77.2"

# The Android / iOS crates link against the mobile target triple; keep the lib
# name free of dashes so `cbindgen`-style tooling stays happy.
[lib]
name = "carmen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = { version = "2.7.0", features = ["unsafe-headers"] }

# Battery reading for the low-battery auto mode (macOS / Linux WebKit has no
# Battery Status API). Android is excluded on purpose: the crate has no
# backend there (`compile_error!`) — its webview is Chromium and reports the
# battery through `navigator.getBattery` instead. iOS is excluded too: the
# crate's platform gate is `any(target_os = "macos", target_os = "ios")`, so
# it compiles its IOKit backend for iOS, but the iOS SDK does not export
# `_IOServiceMatching` & friends — the app archive dies at link with
# "Undefined symbols for architecture arm64". WKWebView has no Battery
# Status API either, so iOS reports `supported: false` and the mode stays a
# manual toggle.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
battery = "0.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
