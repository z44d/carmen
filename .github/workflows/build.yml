name: Build and Release

# Single consolidated workflow — replaces ci.yml + build-desktop.yml +
# build-android.yml. Layout (mirrors the proven z44d/serbase build.yml):
#   * checks (frontend / rust / server / Android / iOS) run on pushes + PRs;
#     the Android check is a native Gradle assemble of android/, and the iOS
#     check is a native Xcode compile of ios/ (simulator), not Tauri;
#   * the desktop matrix, the Android job and the iOS job run for version tags
#     (and for manual workflow_dispatch, so Windows/Android/iOS steps can be
#     smoke-tested without tagging) and need all checks to be green first;
#   * every build job attaches its OWN bundles straight to the GitHub
#     Release via softprops/action-gh-release — there is intentionally NO
#     actions/upload-artifact → download-artifact round-trip (GitHub's
#     artifact size ceiling has bitten us). Several jobs creating/updating
#     the same tag's release is fine: the action falls back to the
#     already-created release when creation races.
#   * `defaults.run.shell: bash` everywhere — the old desktop workflow's
#     `if [ -f package-lock.json ]; …` step died on windows-latest because
#     PowerShell (not bash) is the default shell there.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

# Read-only by default; only the build jobs that attach release assets
# (desktop, Android, iOS) ask for `contents: write`.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Static half of the release body, written by every upload step — the
  # Download table below. Each attach job first appends .github/RELEASE_NOTES.md
  # (the "what's new" section, updated as the release takes shape) to it, so
  # the composed body is still identical everywhere and whichever job
  # finishes last cannot clobber it with something different.
  # A custom body instead of `generate_release_notes`, whose auto-generated
  # text always appends a "Full Changelog:" compare link.
  RELEASE_BODY: |
    ### Downloads

    | Platform | File |
    |---|---|
    | Windows (x64 / ARM64) | `*-x64-setup.exe` / `*-aarch64-setup.exe` (NSIS) |
    | macOS (Apple Silicon + Intel) | `*_universal.dmg` |
    | Linux — Debian / Ubuntu | `*.deb` |
    | Linux — Fedora / RHEL | `*.rpm` |
    | Linux — any distro | `*.AppImage` |
    | Android | `*.apk` (install directly) / `*.aab` (Play Store) |
    | iOS | `*.ipa` (unsigned — sideload with AltStore / SideStore, etc.) |

    Desktop bundles are unsigned (no code-signing certificate yet; macOS gets ad-hoc signing only).
    The iOS IPA is unsigned too: with no certificate or provisioning profile it cannot be installed
    on a stock device without a sideloading tool that re-signs it, nor submitted to the App Store.

jobs:
  # ────────────────────────────── checks ──────────────────────────────
  frontend:
    name: Frontend typecheck + vite build
    # TEMP: v1.1.1-alpha is an iOS-only tag — every non-iOS job skips it.
    if: github.ref_name != 'v1.1.1-alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install JS deps (root = Tauri CLI, frontend = vite build)
        run: |
          npm ci
          npm --prefix frontend ci

      - run: npm run typecheck

      - name: Vite production build
        # NOT `npm run build` — that would also run a full Rust bundle.
        run: npm run build:frontend

  rust:
    name: cargo check (src-tauri)
    # TEMP: v1.1.1-alpha is an iOS-only tag — every non-iOS job skips it.
    if: github.ref_name != 'v1.1.1-alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps (Tauri webkit/appindicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

  server:
    name: Server sanity check (never runs the server)
    # TEMP: v1.1.1-alpha is an iOS-only tag — every non-iOS job skips it.
    if: github.ref_name != 'v1.1.1-alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Create venv and install requirements
        # Always a fresh 3.11 venv — mirrors ./venv locally (system python may
        # be a different major version and is never used).
        run: |
          python -m venv venv
          ./venv/bin/pip install -r server/requirements.txt

      - name: Byte-compile the server package
        run: ./venv/bin/python -m compileall -q server

      - name: Import the FastAPI app (safe at import time)
        # `server/__main__.py` only builds the FastAPI app at import time.
        # The YTMusic client (browser.json), the Redis client and the Telegram
        # client are all created inside the `lifespan` hook, which never runs
        # for a plain import — so no secrets, cookies or Redis are needed.
        # This job must NOT start the server (`./venv/bin/python -m server`).
        run: ./venv/bin/python -c "import server.__main__"

  # ─────────────────────── Android check (native Carmen app) ───────────────────────
  android-check:
    name: Android compile check (native app)
    # Runs on every push/PR like the other checks — the native app has no web
    # view to typecheck: a Gradle assemble is the compile gate (Kotlin, Hilt,
    # Room, resources). JDK 27 temurin, matching the upstream Gradle recipe.
    # TEMP: skipped for the iOS-only v1.1.1-alpha tag like the other non-iOS jobs.
    if: github.ref_name != 'v1.1.1-alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        # Ubuntu runners ship the Android SDK; AGP auto-provisions the pinned
        # NDK (30.0.16248370) once the licenses are accepted.
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -mindepth 2 -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Assemble the GMS mobile universal debug build
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android :app:assembleGmsMobileUniversalDebug --stacktrace

  # ─────────────────────────── desktop bundles ───────────────────────────
  desktop:
    name: ${{ matrix.name }}
    # Tags → build + attach to the release; workflow_dispatch → build only
    # (smoke test without a release).
    # TEMP: v1.1.1-alpha is an iOS-only tag — every non-iOS job skips it.
    if: (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && github.ref_name != 'v1.1.1-alpha'
    needs: [frontend, rust, server]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write # attach bundles to the GitHub release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal (dmg)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: --target universal-apple-darwin --bundles dmg
            release-files: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux (deb + rpm + AppImage)
            os: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu # host = no-op rustup add
            build-args: --bundles deb,rpm,appimage
            release-files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Windows x86_64 (NSIS)
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            build-args: --target x86_64-pc-windows-msvc --bundles nsis
            release-files: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: Windows aarch64 (NSIS)
            os: windows-latest
            rust-targets: aarch64-pc-windows-msvc
            build-args: --target aarch64-pc-windows-msvc --bundles nsis
            release-files: |
              src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps (Tauri webkit/appindicator + rpm for rpmbuild)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps (root = Tauri CLI, frontend = vite build)
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Generate icons from src-tauri/app-icon.png
        run: npm run icons

      - name: Build bundles (tauri build)
        # `bundle.targets: "all"` is narrowed per matrix entry via --bundles;
        # beforeBuildCommand (npm run build:frontend) runs inside tauri build.
        # Windows builds natively with the runner's MSVC toolchain — VS2022
        # ships the ARM64 cross tools, so aarch64-pc-windows-msvc needs no
        # cargo-xwin (its clang-cl `/imsvc` flags broke ring's C build with
        # "clang: error: no such file or directory: '/imsvc'").
        # No code signing is configured — all bundles are unsigned (macOS gets
        # ad-hoc signing only).
        run: >-
          npx tauri build --ci
          ${{ matrix.build-args }}

      - name: Compose release body (Downloads table + .github/RELEASE_NOTES.md)
        # $RELEASE_BODY comes from the workflow-level env; the same two-step
        # append runs in every attach job, so all jobs upload identical text.
        if: github.ref_type == 'tag'
        run: |
          printf '%s\n' "$RELEASE_BODY" > "$RUNNER_TEMP/release-body.md"
          cat .github/RELEASE_NOTES.md >> "$RUNNER_TEMP/release-body.md"

      - name: Attach bundles to the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.release-files }}
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-body.md

  # ──────────────────────────── Android APK/AAB ────────────────────────────
  android:
    name: Android release (native app, APK + AAB)
    # TEMP: v1.1.1-alpha is an iOS-only tag — every non-iOS job skips it.
    if: (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && github.ref_name != 'v1.1.1-alpha'
    needs: [frontend, rust, server]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write # attach APK/AAB to the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          # The native app codesigns from a committed keystore and the
          # translation-credits script needs complete history (blame-based).
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        # Ubuntu runners ship the Android SDK; AGP auto-provisions the pinned
        # NDK (30.0.16248370) once the licenses are accepted.
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -mindepth 2 -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Generate translation contributors (fastlane credit data)
        run: python3 android/scripts/generate_translation_contributors.py

      - name: Build release APK + AAB
        # Signed with the committed android/app/keystore/carmen.keystore (the
        # build script falls back to in-tree credentials; STORE_PASSWORD /
        # KEY_ALIAS / KEY_PASSWORD env vars can still override them).
        # Outputs land under android/app/build/outputs/
        # (apk/<flavor>/release/*.apk, bundle/<flavor>Release/*.aab).
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android \
            :app:assembleGmsMobileUniversalRelease \
            :app:bundleGmsMobileUniversalRelease \
            --stacktrace

      - name: Compose release body (Downloads table + .github/RELEASE_NOTES.md)
        if: github.ref_type == 'tag'
        run: |
          printf '%s\n' "$RELEASE_BODY" > "$RUNNER_TEMP/release-body.md"
          cat .github/RELEASE_NOTES.md >> "$RUNNER_TEMP/release-body.md"

      - name: Stage APK/AAB with Carmen release names
        # Downloaded artifacts keep the gradle default names
        # (app-gms-mobile-universal-release.*); rename them to
        # Carmen_v<version>-universal.{apk,aab} for the release.
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/carmen-assets"
          mkdir -p "$out"
          version="${GITHUB_REF_NAME#v}"
          apk="$(find android/app/build/outputs/apk -name '*universal-release.apk' -print -quit)"
          aab="$(find android/app/build/outputs/bundle -name '*universal-release.aab' -print -quit)"
          [ -n "$apk" ] || { echo "release APK not found"; exit 1; }
          [ -n "$aab" ] || { echo "release AAB not found"; exit 1; }
          cp "$apk" "$out/Carmen_v${version}-universal.apk"
          cp "$aab" "$out/Carmen_v${version}-universal.aab"
          echo "Staged:"; ls -la "$out"

      - name: Attach APK/AAB to the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/carmen-assets/Carmen_v*-universal.apk
            ${{ runner.temp }}/carmen-assets/Carmen_v*-universal.aab
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-body.md


  # ───────────────────────── iOS check (native Swift app) ─────────────────────────
  ios-check:
    name: iOS compile check (simulator)
    # Runs on every push/PR like the other checks — the Swift app has no JS/Rust
    # to verify, just xcodegen + xcodebuild against the iOS Simulator SDK.
    # TEMP: skipped for the iOS-only v1.1.1-alpha tag — the release job below
    # compiles the same code for device anyway.
    if: github.ref_name != 'v1.1.1-alpha'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Guard the iOS SDK
        # Every iOS 26 API in the app is gated with #available(iOS 26.0, *), but
        # the symbols still have to EXIST in the SDK to compile. Without this
        # guard an older runner image fails with cryptic "cannot find
        # glassEffect in scope" errors instead of a clear message.
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          major="${SDK%%.*}"
          echo "iOS Simulator SDK: $SDK"
          if [ "${major:-0}" -lt 26 ]; then
            echo "::error::iOS SDK $SDK is older than 26 — the Liquid Glass build needs Xcode 26+."
            exit 1
          fi

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate the Xcode project (ios/project.yml)
        run: xcodegen generate
        working-directory: ios

      - name: Build for the iOS Simulator
        # The Carmen scheme builds the app AND the embedded CarmenLiveActivity
        # widget extension, so this compiles every Swift file in ios/ (Shared/
        # sources belong to both targets). Unsigned — the runner has no team.
        run: |
          xcodebuild build \
            -project Carmen.xcodeproj \
            -scheme Carmen \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build
        working-directory: ios

  # ──────────────────── iOS IPA, native Swift (unsigned) ────────────────────
  ios:
    name: iOS release (unsigned IPA)
    # Same gating as the other bundle jobs: tags → build + attach; manual
    # workflow_dispatch → build only. Native Xcode build of ios/ (SwiftUI +
    # ActivityKit) — no Tauri/Rust/Node involved. macOS runner because the iOS
    # toolchain only exists there.
    # TEMP: `needs` dropped for the iOS-only v1.1.1-alpha tag — the frontend /
    # rust / server / ios-check jobs all skip that tag, and a skipped
    # dependency would cascade-skip this job. Restore
    # `needs: [frontend, rust, server, ios-check]` after the tag build.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write # attach the IPA to the GitHub release
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Guard the iOS SDK
        # Same guard as ios-check (the two jobs share an Xcode image, but each
        # guards itself so a rerun alone still fails with a clear message).
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          major="${SDK%%.*}"
          echo "iOS Simulator SDK: $SDK"
          if [ "${major:-0}" -lt 26 ]; then
            echo "::error::iOS SDK $SDK is older than 26 — the Liquid Glass build needs Xcode 26+."
            exit 1
          fi

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate the Xcode project (ios/project.yml)
        run: xcodegen generate
        working-directory: ios

      - name: Archive + package unsigned IPA
        # CODE_SIGNING_ALLOWED=NO archives without a certificate or
        # provisioning profile; a sideloading tool (AltStore, SideStore, …)
        # re-signs on install, which is why an unsigned IPA is the shippable
        # artifact. The result is zipped into the Payload/ layout by hand —
        # plain `xcodebuild -exportArchive` would demand signing settings.
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Carmen.xcodeproj \
            -scheme Carmen \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Carmen.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            archive
          mkdir -p build/Payload
          cp -R build/Carmen.xcarchive/Products/Applications/Carmen.app build/Payload/
          (cd build && zip -qry Carmen.ipa Payload)
          ls -la build/Carmen.ipa
        working-directory: ios

      - name: Compose release body (Downloads table + .github/RELEASE_NOTES.md)
        if: github.ref_type == 'tag'
        run: |
          printf '%s\n' "$RELEASE_BODY" > "$RUNNER_TEMP/release-body.md"
          cat .github/RELEASE_NOTES.md >> "$RUNNER_TEMP/release-body.md"

      - name: Attach IPA to the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ios/build/Carmen.ipa
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-body.md
